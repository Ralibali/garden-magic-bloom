name: Native app verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:native
      - run: npx cap sync android
      - name: Use Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build APK and unsigned release bundle
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:bundleRelease
      - name: Check notification permission and 16 KB APK alignment
        run: |
          ! grep -R 'android.permission.SCHEDULE_EXACT_ALARM' android/app/build/intermediates/merged_manifests/debug/
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-builds
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7

  ios:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:native
      - run: npx cap sync ios
      - name: Build for iPhone simulator without signing
        run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .mobile-build/ios -jobs 2 \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: ditto -c -k --keepParent .mobile-build/ios/Build/Products/Debug-iphonesimulator/App.app .mobile-build/odlingsdagboken-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: .mobile-build/odlingsdagboken-simulator.zip
          retention-days: 7
